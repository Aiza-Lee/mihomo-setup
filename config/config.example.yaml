# ==============================================================================
# Mihomo (Clash Meta) 完整配置范例与注释
# ==============================================================================

# 混合代理端口（同时支持 HTTP 与 SOCKS5 协议）
mixed-port: 7890

# 仅本机访问（安全考虑，不开放给局域网其他设备）
allow-lan: false
bind-address: 127.0.0.1

# 运行模式: rule (规则模式) / global (全局代理) / direct (全部直连)
mode: rule

# 日志级别: silent / error / warning / info / debug
log-level: info

# 关闭 IPv6
ipv6: false

# 外部控制端口与 Web 控制台静态文件目录
external-controller: 127.0.0.1:9090
external-ui: ui
secret: ""

# 连接优化
unified-delay: true
tcp-concurrent: true
find-process-mode: strict

# 状态记录
profile:
  store-selected: true
  store-fake-ip: true

# 嗅探器配置
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.apple.com"

# DNS 配置
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost.ptlogin2.qq.com"
    - "+.srv.nintendo.net"
    - "+.stun.*.*"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    "geosite:cn,private":
      - 223.5.5.5
      - 119.29.29.29
    "geosite:geolocation-!cn,gfw":
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query

# 方式一: 使用外部订阅服务 (推荐)
proxy-providers:
  my-subscription:
    type: http
    url: "https://your-subscription-url-here"
    path: ./providers/my-subscription.yaml
    interval: 86400
    health-check:
      enable: true
      interval: 300
      url: https://www.gstatic.com/generate_204

# 方式二: 手动指定静态节点（可选）
# proxies:
#   - name: "香港 01"
#     type: ss
#     server: server.example.com
#     port: 443
#     cipher: chacha20-ietf-poly1305
#     password: "password"

# 策略组
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - DIRECT
    use:
      - my-subscription

  - name: ♻️ 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - my-subscription

  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT

# 分流规则
rules:
  - GEOIP,lan,DIRECT,no-resolve
  - GEOSITE,cn,DIRECT
  - GEOSITE,gfw,🚀 节点选择
  - GEOIP,CN,DIRECT
  - MATCH,🐟 漏网之鱼
